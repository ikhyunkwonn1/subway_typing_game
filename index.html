<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6 Train — Subway Typing Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="bullet" id="line-bullet">6</div>
      <div class="masthead-text">
        <h1>Lexington Av Local</h1>
        <p id="header-subtitle">Pelham Bay Park → Brooklyn Bridge–City Hall</p>
      </div>
      <div class="masthead-meta">
        <span class="counter" id="stop-counter">01 / 38</span>
        <button type="button" id="mute-btn" class="mute" aria-pressed="false" aria-label="Mute sound">
          <svg class="mute-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2l3.5-4.5a.8.8 0 0 1 1.5.5v14a.8.8 0 0 1-1.5.5L6 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M15 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M17.7 5a9 9 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <svg class="mute-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2l3.5-4.5a.8.8 0 0 1 1.5.5v14a.8.8 0 0 1-1.5.5L6 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M16 10l5 4M21 10l-5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="progress-map-wrap">
      <svg id="progress-map" class="progress-map" height="56"></svg>
    </div>

    <main class="scene-wrap">
      <!-- Anchored to the bottom so a short scene crops sky, never the train -->
      <svg id="scene" viewBox="0 0 800 290" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="tunnel-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#08090b" />
            <stop offset="55%" stop-color="#111316" />
            <stop offset="100%" stop-color="#0a0b0d" />
          </linearGradient>
          <radialGradient id="vanishing-glow" cx="50%" cy="52%" r="46%">
            <stop offset="0%" stop-color="#2f353d" stop-opacity="0.32" />
            <stop offset="100%" stop-color="#2f353d" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="light-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.62" />
            <stop offset="45%" stop-color="#ffd9a0" stop-opacity="0.11" />
            <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0" />
          </radialGradient>

          <!-- Brushed stainless under tunnel light -->
          <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#17191c" />
            <stop offset="11%" stop-color="#1e2126" />
            <stop offset="14%" stop-color="#4a5058" />
            <stop offset="24%" stop-color="#737a83" />
            <stop offset="40%" stop-color="#4c525a" />
            <stop offset="52%" stop-color="#5d646c" />
            <stop offset="57%" stop-color="#4a5057" />
            <stop offset="74%" stop-color="#393e44" />
            <stop offset="88%" stop-color="#2a2e33" />
            <stop offset="100%" stop-color="#131518" />
          </linearGradient>
          <linearGradient id="steel-skirt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#22252a" />
            <stop offset="100%" stop-color="#0d0f11" />
          </linearGradient>
          <linearGradient id="cabin-light" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#eef8f1" stop-opacity="0.88" />
            <stop offset="70%" stop-color="#bed5c6" stop-opacity="0.72" />
            <stop offset="100%" stop-color="#63796c" stop-opacity="0.55" />
          </linearGradient>
          <linearGradient id="platform-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#191b1e" />
            <stop offset="100%" stop-color="#0a0b0c" />
          </linearGradient>
          <linearGradient id="spill" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#fff4de" stop-opacity="0.07" />
            <stop offset="55%" stop-color="#fff4de" stop-opacity="0.015" />
            <stop offset="100%" stop-color="#fff4de" stop-opacity="0" />
          </linearGradient>

          <!-- Applied per car: a bbox-relative region stays small enough for
               Chrome to rasterise, and it follows each car as GSAP moves it. -->
          <filter id="train-motion" x="-25%" y="-25%" width="150%" height="150%">
            <feGaussianBlur id="train-blur" in="SourceGraphic" stdDeviation="0 0" />
          </filter>

          <!-- One R142 car body, instanced three times -->
          <g id="car-shell">
            <circle cx="36" cy="103" r="5" fill="#15181b" />
            <circle cx="62" cy="103" r="5" fill="#15181b" />
            <circle cx="156" cy="103" r="5" fill="#15181b" />
            <circle cx="182" cy="103" r="5" fill="#15181b" />
            <rect x="14" y="97" width="76" height="7" fill="#0a0c0e" />
            <rect x="130" y="97" width="76" height="7" fill="#0a0c0e" />

            <rect x="0" y="2" width="220" height="98" rx="4" fill="url(#steel)" />
            <rect x="0" y="2" width="220" height="12" rx="4" fill="#191c20" />
            <rect x="0" y="12" width="220" height="1" fill="#5a616a" opacity="0.5" />
            <rect x="0" y="86" width="220" height="14" fill="url(#steel-skirt)" />
            <rect x="0" y="52" width="220" height="3" fill="#16355e" />
            <rect x="0" y="55" width="220" height="1" fill="#0d1f39" />

            <g fill="#000000" opacity="0.16">
              <rect x="0" y="62" width="220" height="1" /><rect x="0" y="67" width="220" height="1" />
              <rect x="0" y="72" width="220" height="1" /><rect x="0" y="77" width="220" height="1" />
              <rect x="0" y="82" width="220" height="1" />
            </g>

            <g fill="#0b0e10">
              <rect x="8" y="21" width="44" height="27" rx="2" />
              <rect x="59" y="21" width="30" height="27" rx="2" />
              <rect x="96" y="21" width="44" height="27" rx="2" />
              <rect x="147" y="21" width="30" height="27" rx="2" />
              <rect x="184" y="21" width="28" height="27" rx="2" />
            </g>
            <g fill="url(#cabin-light)">
              <rect x="9.5" y="22.5" width="41" height="24" rx="1.5" />
              <rect x="60.5" y="22.5" width="27" height="24" rx="1.5" />
              <rect x="97.5" y="22.5" width="41" height="24" rx="1.5" />
              <rect x="148.5" y="22.5" width="27" height="24" rx="1.5" />
              <rect x="185.5" y="22.5" width="25" height="24" rx="1.5" />
            </g>

            <g stroke="#171a1e" stroke-width="0.9" fill="none">
              <path d="M56 13 V 97" /><path d="M74 21 V 97" /><path d="M92 13 V 97" />
              <path d="M144 13 V 97" /><path d="M162 21 V 97" /><path d="M180 13 V 97" />
            </g>
          </g>

          <!-- Gangway between coupled cars -->
          <g id="car-coupling">
            <rect x="219" y="46" width="22" height="40" fill="#0d1013" />
            <rect x="219" y="46" width="22" height="1" fill="#31363c" />
            <rect x="219" y="85" width="22" height="1" fill="#22262a" />
          </g>
        </defs>

        <rect x="0" y="0" width="800" height="290" fill="url(#tunnel-gradient)" />
        <rect x="0" y="0" width="800" height="290" fill="url(#vanishing-glow)" />

        <!-- Far wall -->
        <g id="tunnel-arches" fill="none" stroke="#1e2126" stroke-width="2">
          <path d="M -40 150 Q 40 96 120 150" />
          <path d="M 80 150 Q 160 96 240 150" />
          <path d="M 200 150 Q 280 96 360 150" />
          <path d="M 320 150 Q 400 96 480 150" />
          <path d="M 440 150 Q 520 96 600 150" />
          <path d="M 560 150 Q 640 96 720 150" />
          <path d="M 680 150 Q 760 96 840 150" />
        </g>
        <g stroke="#171a1e" stroke-width="1.5" fill="none">
          <path d="M0 96 H800" />
          <path d="M0 150 H800" />
        </g>

        <!-- Lamp string: streams past during transit -->
        <g id="tunnel-lights">
          <g fill="url(#light-glow)">
            <circle cx="-700" cy="118" r="24" /><circle cx="-580" cy="124" r="24" />
            <circle cx="-460" cy="118" r="24" /><circle cx="-340" cy="124" r="24" />
            <circle cx="-220" cy="118" r="24" /><circle cx="-100" cy="124" r="24" />
            <circle cx="20" cy="118" r="24" /><circle cx="140" cy="124" r="24" />
            <circle cx="260" cy="118" r="24" /><circle cx="380" cy="124" r="24" />
            <circle cx="500" cy="118" r="24" /><circle cx="620" cy="124" r="24" />
            <circle cx="740" cy="118" r="24" /><circle cx="860" cy="124" r="24" />
            <circle cx="980" cy="118" r="24" /><circle cx="1100" cy="124" r="24" />
            <circle cx="1220" cy="118" r="24" /><circle cx="1340" cy="124" r="24" />
            <circle cx="1460" cy="118" r="24" /><circle cx="1580" cy="124" r="24" />
          </g>
          <g fill="#ffe6bd">
            <circle cx="-700" cy="118" r="2" /><circle cx="-580" cy="124" r="2" />
            <circle cx="-460" cy="118" r="2" /><circle cx="-340" cy="124" r="2" />
            <circle cx="-220" cy="118" r="2" /><circle cx="-100" cy="124" r="2" />
            <circle cx="20" cy="118" r="2" /><circle cx="140" cy="124" r="2" />
            <circle cx="260" cy="118" r="2" /><circle cx="380" cy="124" r="2" />
            <circle cx="500" cy="118" r="2" /><circle cx="620" cy="124" r="2" />
            <circle cx="740" cy="118" r="2" /><circle cx="860" cy="124" r="2" />
            <circle cx="980" cy="118" r="2" /><circle cx="1100" cy="124" r="2" />
            <circle cx="1220" cy="118" r="2" /><circle cx="1340" cy="124" r="2" />
            <circle cx="1460" cy="118" r="2" /><circle cx="1580" cy="124" r="2" />
          </g>
        </g>

        <!-- Track bed -->
        <g>
          <rect x="0" y="228" width="800" height="20" fill="#0a0b0d" />
          <rect x="0" y="234" width="800" height="1.5" fill="#2b2f35" />
          <rect x="0" y="243" width="800" height="1.5" fill="#23262b" />
        </g>

        <!-- Train (behind the platform edge) -->
        <g id="train">
            <g id="train-car-2" transform="translate(430, 140)" filter="url(#train-motion)">
              <use href="#car-shell" />
              <!-- Lead car: side destination sign replaces the last window -->
              <rect x="184" y="21" width="28" height="27" rx="2" fill="#08090b" />
              <circle cx="198" cy="34" r="7.5" fill="#00933C" />
              <text x="198" y="37.5" class="train-bullet-text">6</text>
              <circle cx="215" cy="60" r="1.6" fill="#ffe4b0" />
            </g>

            <g id="train-car-1" transform="translate(190, 140)" filter="url(#train-motion)">
              <!-- Trailing car rides along inside this group's transform -->
              <g transform="translate(-240, 0)">
                <use href="#car-shell" />
                <use href="#car-coupling" />
              </g>
              <use href="#car-shell" />
              <use href="#car-coupling" />
            </g>
        </g>

        <!-- Platform: the surface we're standing on -->
        <g id="platform">
          <rect x="0" y="246" width="800" height="44" fill="url(#platform-gradient)" />
          <rect x="0" y="246" width="800" height="3" fill="#07080a" />
          <rect x="0" y="249" width="800" height="6" fill="#c9a10c" />
          <rect x="0" y="249" width="800" height="1.5" fill="#f0c81a" />
          <rect x="0" y="255" width="800" height="1.5" fill="#6d5807" />
        </g>

        <!-- Foreground columns, framing the shot -->
        <g fill="#040405">
          <rect x="-4" y="0" width="24" height="290" />
          <rect x="780" y="0" width="24" height="290" />
        </g>
        <g fill="#ffffff" opacity="0.045">
          <rect x="20" y="0" width="1.5" height="290" />
          <rect x="778.5" y="0" width="1.5" height="290" />
        </g>

        <!-- Light rising from the keyboard below the frame -->
        <rect x="0" y="196" width="800" height="94" fill="url(#spill)" />
      </svg>

      <!-- Wayfinding sign lives in HTML so the SVG crop can never hide it -->
      <div class="station-sign">
        <span class="station-sign-bullet">6</span>
        <span id="sign-station-name">Pelham Bay Park</span>
      </div>

      <div id="win-overlay" class="win-overlay hidden">
        <div class="win-card">
          <span class="win-eyebrow">End of the line</span>
          <div class="win-title">Brooklyn Bridge–City Hall</div>
          <p>All 38 stops from Pelham Bay Park. Everybody off.</p>
          <button id="restart-btn" type="button">Ride again</button>
        </div>
      </div>
    </main>

    <div class="answer-zone">
      <div class="track-bar" id="track-bar">
        <div class="stop-chip stop-chip--prev" id="prev-stop">
          <svg class="chip-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span id="prev-stop-name"></span>
        </div>

        <form id="answer-form" class="answer-form" autocomplete="off">
          <input
            id="answer-input"
            type="text"
            placeholder="Type this station…"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button type="submit" class="submit-btn" aria-label="Confirm station">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </form>

        <div class="stop-chip stop-chip--next" id="next-stop">
          <span id="next-stop-name"></span>
          <svg class="chip-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <p id="feedback" class="feedback"></p>
    </div>

    <div class="keyboard-wrap">
      <div id="keyboard"></div>
    </div>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/normalize.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
