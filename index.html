<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6 Train — Subway Typing Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="bullet" id="line-bullet">6</div>
      <div class="masthead-text">
        <h1>Lexington Av Local</h1>
        <p id="header-subtitle">Pelham Bay Park → Brooklyn Bridge–City Hall</p>
      </div>
      <div class="masthead-meta">
        <span class="counter" id="stop-counter">01 / 38</span>
        <button type="button" id="mute-btn" class="mute" aria-pressed="false" aria-label="Mute sound">
          <svg class="mute-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2l3.5-4.5a.8.8 0 0 1 1.5.5v14a.8.8 0 0 1-1.5.5L6 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M15 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M17.7 5a9 9 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <svg class="mute-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2l3.5-4.5a.8.8 0 0 1 1.5.5v14a.8.8 0 0 1-1.5.5L6 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M16 10l5 4M21 10l-5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="progress-map-wrap">
      <svg id="progress-map" class="progress-map" height="56"></svg>
    </div>

    <main class="scene-wrap">
      <svg id="scene" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="tunnel-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#08090b" />
            <stop offset="55%" stop-color="#121417" />
            <stop offset="100%" stop-color="#0a0b0d" />
          </linearGradient>
          <radialGradient id="vanishing-glow" cx="50%" cy="58%" r="46%">
            <stop offset="0%" stop-color="#3a4048" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#3a4048" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="light-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.75" />
            <stop offset="45%" stop-color="#ffd9a0" stop-opacity="0.14" />
            <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0" />
          </radialGradient>

          <!-- Brushed stainless, lit from above -->
          <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#41464c" />
            <stop offset="12%" stop-color="#8f959d" />
            <stop offset="30%" stop-color="#c3c9d1" />
            <stop offset="46%" stop-color="#767c84" />
            <stop offset="72%" stop-color="#9aa1a9" />
            <stop offset="100%" stop-color="#33373c" />
          </linearGradient>
          <linearGradient id="steel-skirt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a2d31" />
            <stop offset="100%" stop-color="#101214" />
          </linearGradient>
          <linearGradient id="cabin-light" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e8f2ec" stop-opacity="0.92" />
            <stop offset="100%" stop-color="#9fb4a8" stop-opacity="0.55" />
          </linearGradient>
          <linearGradient id="platform-gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1a1c1f" />
            <stop offset="100%" stop-color="#0a0b0c" />
          </linearGradient>
          <linearGradient id="spill" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#fff4de" stop-opacity="0.20" />
            <stop offset="60%" stop-color="#fff4de" stop-opacity="0.04" />
            <stop offset="100%" stop-color="#fff4de" stop-opacity="0" />
          </linearGradient>

          <!-- Fixed region so the train never clips as it travels off-frame -->
          <filter id="train-motion" filterUnits="userSpaceOnUse" x="-1200" y="-120" width="3200" height="700">
            <feGaussianBlur id="train-blur" in="SourceGraphic" stdDeviation="0 0" />
          </filter>
        </defs>

        <rect x="0" y="0" width="800" height="420" fill="url(#tunnel-gradient)" />
        <rect x="0" y="0" width="800" height="420" fill="url(#vanishing-glow)" />

        <!-- Far wall: tunnel arches -->
        <g id="tunnel-arches" fill="none" stroke="#212429" stroke-width="2.5">
          <path d="M -40 268 Q 40 178 120 268" />
          <path d="M 80 268 Q 160 178 240 268" />
          <path d="M 200 268 Q 280 178 360 268" />
          <path d="M 320 268 Q 400 178 480 268" />
          <path d="M 440 268 Q 520 178 600 268" />
          <path d="M 560 268 Q 640 178 720 268" />
          <path d="M 680 268 Q 760 178 840 268" />
        </g>
        <g stroke="#191c20" stroke-width="1.5" fill="none">
          <path d="M0 268 H800" />
          <path d="M0 176 H800" />
        </g>

        <!-- Lamp string: streams past during transit -->
        <g id="tunnel-lights">
          <g fill="url(#light-glow)">
            <circle cx="-700" cy="146" r="26" /><circle cx="-580" cy="152" r="26" />
            <circle cx="-460" cy="146" r="26" /><circle cx="-340" cy="152" r="26" />
            <circle cx="-220" cy="146" r="26" /><circle cx="-100" cy="152" r="26" />
            <circle cx="20" cy="146" r="26" /><circle cx="140" cy="152" r="26" />
            <circle cx="260" cy="146" r="26" /><circle cx="380" cy="152" r="26" />
            <circle cx="500" cy="146" r="26" /><circle cx="620" cy="152" r="26" />
            <circle cx="740" cy="146" r="26" /><circle cx="860" cy="152" r="26" />
            <circle cx="980" cy="146" r="26" /><circle cx="1100" cy="152" r="26" />
            <circle cx="1220" cy="146" r="26" /><circle cx="1340" cy="152" r="26" />
            <circle cx="1460" cy="146" r="26" /><circle cx="1580" cy="152" r="26" />
          </g>
          <g fill="#ffe6bd">
            <circle cx="-700" cy="146" r="2.4" /><circle cx="-580" cy="152" r="2.4" />
            <circle cx="-460" cy="146" r="2.4" /><circle cx="-340" cy="152" r="2.4" />
            <circle cx="-220" cy="146" r="2.4" /><circle cx="-100" cy="152" r="2.4" />
            <circle cx="20" cy="146" r="2.4" /><circle cx="140" cy="152" r="2.4" />
            <circle cx="260" cy="146" r="2.4" /><circle cx="380" cy="152" r="2.4" />
            <circle cx="500" cy="146" r="2.4" /><circle cx="620" cy="152" r="2.4" />
            <circle cx="740" cy="146" r="2.4" /><circle cx="860" cy="152" r="2.4" />
            <circle cx="980" cy="146" r="2.4" /><circle cx="1100" cy="152" r="2.4" />
            <circle cx="1220" cy="146" r="2.4" /><circle cx="1340" cy="152" r="2.4" />
            <circle cx="1460" cy="146" r="2.4" /><circle cx="1580" cy="152" r="2.4" />
          </g>
        </g>

        <!-- Track bed -->
        <g>
          <rect x="0" y="286" width="800" height="20" fill="#0b0c0e" />
          <rect x="0" y="292" width="800" height="1.5" fill="#2e3238" />
          <rect x="0" y="301" width="800" height="1.5" fill="#26292e" />
        </g>

        <!-- Station sign, mounted on the tunnel wall -->
        <g id="station-sign" transform="translate(400, 88)">
          <rect x="-206" y="-31" width="412" height="62" fill="#0b0c0e" stroke="#2b2f35" stroke-width="1" />
          <rect x="-206" y="-31" width="412" height="1.5" fill="#3a3f46" />
          <circle cx="-172" cy="0" r="19" fill="#00933C" />
          <text x="-172" y="7" class="sign-bullet-text">6</text>
          <text id="sign-station-name" x="-138" y="7" class="sign-station-text">Pelham Bay Park</text>
        </g>

        <!-- Train (behind the platform edge) -->
        <g filter="url(#train-motion)">
          <g id="train">
            <g id="train-car-2" transform="translate(430, 190)">
              <rect x="0" y="98" width="220" height="14" fill="#0a0b0c" />
              <circle cx="34" cy="106" r="7" fill="#1a1d20" />
              <circle cx="64" cy="106" r="7" fill="#1a1d20" />
              <circle cx="156" cy="106" r="7" fill="#1a1d20" />
              <circle cx="186" cy="106" r="7" fill="#1a1d20" />
              <rect x="0" y="2" width="220" height="98" rx="9" fill="url(#steel)" />
              <rect x="0" y="76" width="220" height="24" fill="url(#steel-skirt)" />
              <rect x="0" y="70" width="220" height="5" fill="#123a6b" />
              <rect x="8" y="18" width="60" height="34" rx="3" fill="#0c0f11" />
              <rect x="10" y="20" width="56" height="30" rx="2" fill="url(#cabin-light)" />
              <rect x="80" y="18" width="60" height="34" rx="3" fill="#0c0f11" />
              <rect x="82" y="20" width="56" height="30" rx="2" fill="url(#cabin-light)" />
              <rect x="152" y="18" width="42" height="34" rx="3" fill="#0c0f11" />
              <rect x="154" y="20" width="38" height="30" rx="2" fill="url(#cabin-light)" />
              <g fill="none" stroke="#20242a" stroke-width="1">
                <path d="M74 4 V 98" /><path d="M146 4 V 98" />
              </g>
              <g fill="#ffffff" opacity="0.05">
                <rect x="0" y="58" width="220" height="1" /><rect x="0" y="63" width="220" height="1" />
              </g>
              <!-- Lead cab -->
              <rect x="196" y="14" width="22" height="18" rx="2" fill="#0b0d0f" />
              <circle cx="207" cy="23" r="6.5" fill="#00933C" />
              <text x="207" y="27" class="train-bullet-text">6</text>
              <circle cx="204" cy="88" r="4" fill="#fff3d4" />
              <circle cx="204" cy="88" r="9" fill="#fff3d4" opacity="0.18" />
              <circle cx="216" cy="88" r="3" fill="#ffd9d9" opacity="0.55" />
            </g>
            <g id="train-car-1" transform="translate(190, 190)">
              <rect x="0" y="98" width="220" height="14" fill="#0a0b0c" />
              <circle cx="34" cy="106" r="7" fill="#1a1d20" />
              <circle cx="64" cy="106" r="7" fill="#1a1d20" />
              <circle cx="156" cy="106" r="7" fill="#1a1d20" />
              <circle cx="186" cy="106" r="7" fill="#1a1d20" />
              <rect x="0" y="2" width="220" height="98" rx="9" fill="url(#steel)" />
              <rect x="0" y="76" width="220" height="24" fill="url(#steel-skirt)" />
              <rect x="0" y="70" width="220" height="5" fill="#123a6b" />
              <rect x="8" y="18" width="60" height="34" rx="3" fill="#0c0f11" />
              <rect x="10" y="20" width="56" height="30" rx="2" fill="url(#cabin-light)" />
              <rect x="80" y="18" width="60" height="34" rx="3" fill="#0c0f11" />
              <rect x="82" y="20" width="56" height="30" rx="2" fill="url(#cabin-light)" />
              <rect x="152" y="18" width="60" height="34" rx="3" fill="#0c0f11" />
              <rect x="154" y="20" width="56" height="30" rx="2" fill="url(#cabin-light)" />
              <g fill="none" stroke="#20242a" stroke-width="1">
                <path d="M74 4 V 98" /><path d="M146 4 V 98" />
              </g>
              <g fill="#ffffff" opacity="0.05">
                <rect x="0" y="58" width="220" height="1" /><rect x="0" y="63" width="220" height="1" />
              </g>
            </g>
          </g>
        </g>

        <!-- Platform: the surface we're standing on -->
        <g id="platform">
          <rect x="0" y="306" width="800" height="114" fill="url(#platform-gradient)" />
          <rect x="0" y="306" width="800" height="4" fill="#08090a" />
          <rect x="0" y="310" width="800" height="7" fill="#FCCC0A" />
          <rect x="0" y="317" width="800" height="2" fill="#8a7106" />
          <g fill="#0e1012">
            <rect x="0" y="330" width="800" height="1" opacity="0.8" />
          </g>
        </g>

        <!-- Foreground columns, framing the shot -->
        <g fill="#040405">
          <rect x="-4" y="0" width="26" height="420" />
          <rect x="778" y="0" width="26" height="420" />
        </g>
        <g fill="#ffffff" opacity="0.05">
          <rect x="22" y="0" width="1.5" height="420" />
          <rect x="776.5" y="0" width="1.5" height="420" />
        </g>

        <!-- Light rising from the keyboard below the frame -->
        <rect x="0" y="250" width="800" height="170" fill="url(#spill)" />
      </svg>

      <div id="win-overlay" class="win-overlay hidden">
        <div class="win-card">
          <span class="win-eyebrow">End of the line</span>
          <div class="win-title">Brooklyn Bridge–City Hall</div>
          <p>All 38 stops from Pelham Bay Park. Everybody off.</p>
          <button id="restart-btn" type="button">Ride again</button>
        </div>
      </div>
    </main>

    <div class="answer-zone">
      <div class="track-bar" id="track-bar">
        <div class="stop-chip stop-chip--prev" id="prev-stop">
          <svg class="chip-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span id="prev-stop-name"></span>
        </div>

        <form id="answer-form" class="answer-form" autocomplete="off">
          <input
            id="answer-input"
            type="text"
            placeholder="Type this station…"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button type="submit" class="submit-btn" aria-label="Confirm station">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </form>

        <div class="stop-chip stop-chip--next" id="next-stop">
          <span id="next-stop-name"></span>
          <svg class="chip-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <p id="feedback" class="feedback"></p>
    </div>

    <div class="keyboard-wrap">
      <div id="keyboard"></div>
    </div>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/normalize.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
